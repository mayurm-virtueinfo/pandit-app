name: iOS Development (TestFlight & Firebase)

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Custom Marketing Version (e.g. 1.1.0, leave blank to use Xcode project default)'
        required: false
        type: string
      build_number:
        description: 'Custom Build Number (e.g. 22, leave blank for TestFlight auto-increment)'
        required: false
        type: string
      release_notes:
        description: 'Release notes / Changelog (optional)'
        required: false
        type: string

concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build & Distribute iOS Development
    runs-on: macos-14
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Configure .env.development
        env:
          ENV_CONTENT: ${{ secrets.ENV_DEVELOPMENT || secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > .env.development
            cp .env.development .env
            echo "Successfully generated .env.development from secret."
          elif [ -f .env.development ]; then
            echo ".env.development already present in repository."
            cp .env.development .env
          else
            echo "Error: Missing ENV_DEVELOPMENT / ENV_FILE secret and .env.development file!" >&2
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          bundle exec pod install --project-directory=ios

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_DEV_BASE64 || secrets.IOS_PROVISIONING_PROFILE_PROD_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pwd' }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Error: Missing Apple Distribution Certificate secret!" >&2
            exit 1
          fi
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Error: Missing Provisioning Profile secret!" >&2
            exit 1
          fi

          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/dev_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(strings "$PP_PATH" | grep -A1 -m1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          if [ -n "$PROFILE_UUID" ]; then
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            echo "Installed provisioning profile with UUID: $PROFILE_UUID"
          else
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision
            echo "Installed provisioning profile as dev.mobileprovision"
          fi

      - name: Configure Firebase Credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s\n' "$FIREBASE_JSON" > firebase-credentials.json
            echo "FIREBASE_SERVICE_ACCOUNT_PATH=$GITHUB_WORKSPACE/firebase-credentials.json" >> $GITHUB_ENV
            echo "Wrote firebase-credentials.json for App Distribution."
          elif [ -n "$FIREBASE_CLI_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_CLI_TOKEN" >> $GITHUB_ENV
            echo "Configured FIREBASE_TOKEN for App Distribution."
          else
            echo "Warning: No FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_TOKEN configured in secrets."
          fi

      - name: Execute Fastlane iOS Development
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS || '1:763089003272:ios:c172ce64912035c96342bd' }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS_DEV || 'pandit-dev-testers' }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 || 'false' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '5DSXYK6JTQ' }}
          APPLE_ITC_TEAM_ID: ${{ secrets.APPLE_ITC_TEAM_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes || github.event.head_commit.message }}
        run: |
          bundle exec fastlane ios development

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore

      - name: Clean up temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
